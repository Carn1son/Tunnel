<style>
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; }
  body {
    background: #000; color: #8b929c;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: safe center; min-height: 100%;
    gap: clamp(28px, 6vh, 64px); padding: 48px 20px;
    -webkit-font-smoothing: antialiased;
  }
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; width: min(100%, 1280px); }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; width: min(100%, 580px); gap: clamp(22px, 4.5vh, 40px); } }
  a.app { display: flex !important; align-items: center; }
  a.app {
    --c: #f7931e;
    display: block; position: relative; padding: clamp(22px, 4vw, 36px);
    border-radius: 22px; text-decoration: none;
    border: 1px solid #141414; background: #050505;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .35s, box-shadow .35s;
    opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards;
  }
  a.app.green { --c: #2bc265; animation-delay: .15s; }
  a.app.blue { --c: #3b82f6; animation-delay: .3s; }
  a.app img { display: block; width: 100%; height: auto; transition: filter .35s; }
  a.app:hover, a.app:focus-visible {
    transform: translateY(-4px); outline: none;
    border-color: color-mix(in srgb, var(--c) 45%, #141414);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 20%, transparent), 0 24px 70px -20px color-mix(in srgb, var(--c) 45%, transparent);
  }
  a.app:hover img { filter: drop-shadow(0 0 18px color-mix(in srgb, var(--c) 35%, transparent)); }
  a.app span {
    position: absolute; right: 20px; bottom: 14px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--c); opacity: 0; transform: translateX(-6px); transition: opacity .3s, transform .3s;
  }
  a.app:hover span, a.app:focus-visible span { opacity: 1; transform: none; }
  footer { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #3a3d42; opacity: 0; animation: rise .9s .5s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { a.app, footer { animation: none; opacity: 1; } a.app { transition: none; } }
  @media (hover: none) { a.app span { opacity: .85; transform: none; } }
</style>
