<!DOCTYPE html>
<html lang="ru" data-ui="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Tunnel — UI prototype. Layout: top bar, vertical tab rail on the left, content on the right; settings open over the tabs. */
:root {
  color-scheme: dark;
  --bg: #0a0a0a; --panel: #121212; --panel2: #1a1a1a; --fg: #ececec; --muted: #8c8c8c; --line: #272727;
  --accent: #3b82f6; --accent-fg: #ffffff; --ok: #3b82f6; --warn: #f0b155; --err: #ef5350; --off: #6b7280;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
html[data-ui=light] { color-scheme: light; --bg: #ebebeb; --panel: #ffffff; --panel2: #f3f3f3; --fg: #141414; --muted: #5f5f5f; --line: #d4d4d4; --accent: #2563eb; --ok: #2563eb; --warn: #9a5b00; --err: #c62828; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 13px; line-height: 1.4; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 16px; letter-spacing: .06em; }
.brand svg { width: 26px; height: 26px; }
.status { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 20px; margin-left: 6px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
.status.on { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.status.on i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.status.wait i { background: var(--warn); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.grow { flex: 1; }
.iconbtn { width: 34px; height: 32px; padding: 0; border: 0; background: none; color: var(--fg); cursor: pointer; display: inline-grid; place-items: center; border-radius: 6px; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:hover { color: color-mix(in srgb, var(--accent) 70%, var(--fg)); }
.iconbtn[aria-pressed=true] { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* main */
.main { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; }
.rail { border-right: 1px solid var(--line); background: var(--panel); padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; }
.tab { font: inherit; text-align: left; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab:hover { color: var(--fg); }
.tab[aria-selected=true] { border-color: var(--line); background: var(--panel2); color: var(--fg); }
.tab[aria-selected=true] svg { color: var(--accent); }
.tab .ls { display: none; }
.rail .ver { margin-top: auto; padding: 8px 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.view { overflow: auto; padding: 16px 18px 24px; min-width: 0; }
.view > .inner { max-width: 1280px; display: grid; gap: 14px; }
.subtabs { display: none !important; }
.tab .bl, .btn .bl { display: inline; }

/* common */
h2 { font-family: var(--f-display); font-size: 20px; margin: 0; letter-spacing: .02em; }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.head p { margin: 0; color: var(--muted); flex-basis: 100%; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.btn { font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--err); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; justify-self: start; width: max-content; max-width: 100%; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { font: inherit; padding: 5px 12px; border: 0; background: var(--panel2); color: var(--fg); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); }
input[type=text], input[type=password], input[type=search], select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); width: 100%; min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 12px; resize: vertical; min-height: 120px; line-height: 1.5; }
input.mono { font-family: var(--f-mono); font-size: 12px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.field { display: grid; gap: 4px; align-content: start; }
.field > span { color: var(--muted); font-size: 12px; }
.field small { color: var(--muted); font-size: 11.5px; }
.field small.bad { color: var(--err); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--fg); font-size: 15px; }

/* switch */
.sw { position: relative; width: 36px; height: 20px; flex: none; }
.sw input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw input:checked + i { background: var(--accent); }
.sw input:checked + i::after { transform: translateX(16px); }
.sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 4px 0; }
.srow small { display: block; color: var(--muted); font-size: 11.5px; }

/* connection hero */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 18px; }
.power { width: 86px; height: 86px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel2); color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: all .2s; }
.power svg { width: 36px; height: 36px; }
.power:hover { border-color: var(--accent); color: var(--fg); }
.power.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 55%, transparent); }
.power.wait { border-color: var(--warn); color: var(--warn); animation: blink 1s infinite; }
.hero .st { font-family: var(--f-display); font-size: 22px; }
.hero .sshort { display: none; }
.hero .sub { color: var(--muted); font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 22px; text-align: right; }
.stats b { font-family: var(--f-mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; display: block; }
.stats span { font-size: 11px; color: var(--muted); }

/* server cards */
.list { display: grid; gap: 8px; }
.srv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
.srv:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.srv.sel { border-color: var(--accent); }
.srv .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); }
.srv.sel .dot { border-color: var(--accent); background: var(--accent); }
.srv .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srv .ad { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-family: var(--f-mono); font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.a { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

/* menus */
.ctxmenu { position: fixed; z-index: 45; min-width: 200px; padding: 6px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 14px 40px rgb(0 0 0 / .45); display: grid; }
.ctxmenu button { font: inherit; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--fg); cursor: pointer; }
.ctxmenu button:hover { background: var(--panel); }
.ctxmenu button.bad { color: var(--err); }

/* routing */
.rgrid { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; align-items: start; }
.prof { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
.prof:hover { background: var(--panel2); }
.prof.sel { border-color: var(--line); background: var(--panel2); }
.prof.sel b { color: var(--accent); }
.prof .tag { flex: none; }
.prof b { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* split tunnelling */
.items { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
.item.off { opacity: .5; }
.item .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-family: var(--f-display); font-size: 13px; color: #fff; }
.item .t { min-width: 0; }
.item .t b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.x:hover { color: var(--err); }
.addrow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 8px; }
.updln { font-size: 12.5px; margin: 2px 0 6px; } .updln .ok { color: var(--accent); } .updln .bad { color: var(--err); }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
textarea.lines4 { min-height: 0; padding-bottom: 0; height: calc(6em + 9px); } /* exactly four lines; more by scrolling or dragging the corner */
.setfoot { display: grid; }
.setfoot .lk { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); text-decoration: none; transition: border-color .15s, transform .15s; min-width: 0; }
.setfoot .lk:hover, .setfoot .lk:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-1px); }
.setfoot .lk svg { width: 28px; height: 28px; flex: none; color: var(--fg); }
.setfoot .lk span { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
.setfoot .lk b { font-size: 13.5px; }
.setfoot .lk small { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.setfoot .lk i { font-style: normal; color: var(--muted); font-size: 13px; }
.credits a { color: var(--accent); text-decoration: none; } .credits a:hover { text-decoration: underline; } .nw { white-space: nowrap; }
.tag.warnc { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.admstat .head { flex-wrap: nowrap; } .admname { font-size: 16px; } .admhost { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.admmeta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.admcta { justify-items: start; } .admjob b { font-weight: 600; }
.admlog { margin: 0; max-height: 220px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--f-mono); font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
.admlog.big { max-height: 60vh; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } .chips .prof { font: inherit; background: none; color: inherit; flex: none; }
.udot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); } .udot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.online { color: var(--accent); }
.utraffic { text-align: right; } .utraffic b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; display: block; } .utraffic small { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.admtot { font-size: 11.5px; }
.ok { color: var(--accent); } .bad { color: var(--err); }
.wq { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.wq > i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-size: 11.5px; font-weight: 600; display: grid; place-items: center; margin-top: 18px; }
.note.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); color: var(--fg); }
.note { overflow-wrap: anywhere; font-size: 12px; color: var(--muted); padding: 8px 10px; border-left: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 0 6px 6px 0; }

/* log */
.logbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.logbar input { flex: 1 1 220px; width: auto; }
.logt { width: 100%; border-collapse: collapse; font-family: var(--f-mono); font-size: 12px; }
.logt th { text-align: left; font-family: var(--f-body); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.logt td { padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.logt td.vpn { color: var(--accent); }
.logt td.byp { color: var(--muted); }
.logt td.rej { color: var(--err); }
.logwrap { max-height: calc(100vh - 230px); overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }

/* settings overlay */
.setpane { position: absolute; top: 0; right: 0; bottom: 0; width: clamp(380px, 33.34%, 600px); background: var(--bg); overflow: auto; z-index: 5; border-left: 1px solid var(--line); box-shadow: -18px 0 44px rgb(0 0 0 / .35); animation: slidein .16s ease-out; }
@keyframes slidein { from { transform: translateX(24px); opacity: .4; } }
.setshade { position: absolute; inset: 0; background: rgb(0 0 0 / .32); z-index: 4; }
.main { position: relative; }
.sethead { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
.sethead b { font-family: var(--f-display); font-size: 18px; flex: 1; }
.setbody { padding: 14px 16px 24px; display: grid; gap: 12px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px 12px; margin: 0; display: grid; gap: 6px; background: var(--panel); }
legend { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 0 4px; }
.about { display: flex; gap: 14px; align-items: center; }
.about svg { width: 54px; height: 54px; flex: none; }
.about a { color: var(--accent); text-decoration: none; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); padding: 0; width: min(560px, 94vw); max-height: 90vh; }
dialog::backdrop { background: rgb(0 0 0 / .6); }
.dlg { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: 90vh; }
.dlg header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.dlg header b { font-family: var(--f-display); font-size: 17px; flex: 1; }
.dlg .body { padding: 14px 16px; overflow: auto; display: grid; gap: 11px; }
.dlg footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
details.adv summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details.adv[open] > div { display: grid; gap: 11px; margin-top: 8px; }

/* toast */
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 9px 16px; border-radius: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .4); z-index: 60; }
.toast b { color: var(--accent); font-weight: 600; }

@media (max-width: 760px) {
  .app { grid-template-rows: auto minmax(0, 1fr); }
  .main { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) auto; }
  .rail { grid-row: 2; flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--line); padding: 4px; }
  .tab { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 10.5px; flex: 1; text-align: center; justify-content: center; }
  .tab .lf { display: none !important; }
  .tab { min-width: 0; padding: 6px 1px; flex: 1 1 auto !important; }
  .tab .ls { font-size: min(10.5px, 2.5vw); display: block !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  html, body { overflow-x: hidden; }
  .brand { font-size: 0; gap: 0; }
  .seg { width: 100%; display: flex; }
  .seg button { flex: 1; white-space: normal; padding: 7px 8px; }
  .srow .seg { width: auto; }
  #reBtn .rl { display: none; }
  .tab svg { width: 22px; height: 22px; }
  .view { grid-row: 1; padding: 12px 12px 18px; }
  .setpane { bottom: 0; }
  .top { padding: 8px 10px; gap: 6px; }
  .status { margin-left: 0; max-width: 46vw; overflow: hidden; }
  .status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero { padding: 14px; gap: 12px; justify-items: center; text-align: center; }
  .stats { text-align: center; width: 100%; justify-content: space-around; }
  .head .btn { padding: 6px 9px; }
  .addrow { grid-template-columns: minmax(0, 1fr) auto; }
  .addrow #ipNote { grid-column: 1 / -1; grid-row: 2; }
  .logt th:nth-child(3), .logt td:nth-child(3) { display: none; }
  .logwrap { max-height: none; }
  dialog { width: 96vw; }
  input, select, textarea { font-size: 16px; }

  .view { overflow: hidden; display: flex; flex-direction: column; padding: 10px 12px; }
  .view > .inner { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; max-width: none; }
  h2 { font-size: 18px; }
  .head { flex-wrap: nowrap; }
  .head .btn .bl, #addProf .bl { display: none; }
  .head .btn { padding: 7px 10px; }
  .box { padding: 12px; gap: 8px; }
  .empty { padding: 18px 10px; }
  /* servers */
  .box.hero { grid-template-columns: auto minmax(0, 1fr); padding: 12px 14px; gap: 6px 14px; text-align: left; justify-items: stretch; }
  .power { width: 62px; height: 62px; } .power svg { width: 26px; height: 26px; }
  .hero .st { font-size: 19px; }
  .hero .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .hero .sfull { display: none; }
  .hero .sshort { display: inline; }
  .stats { grid-column: 1 / -1; grid-template-columns: repeat(3, 1fr); text-align: center; padding-top: 6px; border-top: 1px solid var(--line); }
  .stats b { font-size: 15px; }
  #srvList { flex: 1; min-height: 0; overflow: auto; align-content: start; }
  /* routing */
  .rgrid { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .profbox { display: flex; align-items: center; gap: 6px; padding: 6px !important; }
  .profbox .eyebrow { display: none; }

<script type="text/plain" id="tunnelctl">
#!/bin/sh
# Tunnel server helper: installs and manages a TrustTunnel endpoint for the Tunnel app.
# The app uploads this file over SSH and runs:  sh tunnelctl.sh <command> [args]
# Commands print one JSON document (or progress lines for install/update) and exit non-zero on failure.
# Stats: a systemd timer runs "collect" every 5 minutes at the lowest CPU and IO priority.

DIR="${TT_DIR:-/opt/trusttunnel}"
STATS="$DIR/tunnel-stats.tsv"
METRICS="127.0.0.1:1987"
INSTALL_URL="https://raw.githubusercontent.com/TrustTunnel/TrustTunnel/refs/heads/master/scripts/install.sh"
PATH="$PATH:/usr/sbin:/sbin:/usr/local/bin"
USER="${USER:-$(id -un 2>/dev/null || echo root)}"; export USER PATH   # the official installer needs $USER

say() { printf '%s\n' "$*"; }
die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
# JSON string
js() { printf '"%s"' "$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g' | tr -d '\n\r\t')"; }
need_root() { [ "$(id -u)" = 0 ] || die "root rights are needed (run as root or allow sudo)"; }
valid_name() { printf '%s' "$1" | grep -Eq '^[A-Za-z0-9_.@-]{1,64}$' || die "bad user name: use letters, digits, . _ - @"; }
valid_pass() { printf '%s' "$1" | grep -Eq '^[A-Za-z0-9_.@%+=!#-]{4,128}$' || die "bad password: 4-128 characters, no spaces or quotes"; }

fetch() { # url -> stdout
  if command -v curl >/dev/null 2>&1; then curl -fsSL --max-time "${2:-60}" "$1"
  elif command -v wget >/dev/null 2>&1; then wget -qO- -T "${2:-60}" "$1"
  else return 127; fi
}

ensure_tools() { # curl and tar for the official installer
  for t in curl tar; do
    command -v "$t" >/dev/null 2>&1 && continue
    say "Installing $t…"
    if command -v apt-get >/dev/null 2>&1; then DEBIAN_FRONTEND=noninteractive apt-get update -qq >/dev/null 2>&1; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$t" >/dev/null 2>&1
    elif command -v dnf >/dev/null 2>&1; then dnf install -y -q "$t" >/dev/null 2>&1
    elif command -v yum >/dev/null 2>&1; then yum install -y -q "$t" >/dev/null 2>&1
    elif command -v apk >/dev/null 2>&1; then apk add -q "$t" >/dev/null 2>&1
    fi
    command -v "$t" >/dev/null 2>&1 || die "cannot install $t"
  done
}

# ---------- credentials.toml as "name<TAB>password" lines
creds_file() {
  f=$(sed -n 's/^[[:space:]]*credentials_file[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$DIR/vpn.toml" 2>/dev/null | head -1)
  [ -n "$f" ] || f="credentials.toml"
  case "$f" in /*) printf '%s' "$f" ;; *) printf '%s/%s' "$DIR" "$f" ;; esac
}
creds_read() {
  awk '
    /^[[:space:]]*\[\[client\]\]/ { if (u != "") print u "\t" p; u=""; p=""; next }
    /^[[:space:]]*username[[:space:]]*=/ { s=$0; sub(/^[^=]*=[[:space:]]*/, "", s); gsub(/^"|"[[:space:]]*$/, "", s); u=s; next }
    /^[[:space:]]*password[[:space:]]*=/ { s=$0; sub(/^[^=]*=[[:space:]]*/, "", s); gsub(/^"|"[[:space:]]*$/, "", s); p=s; next }
    END { if (u != "") print u "\t" p }' "$(creds_file)" 2>/dev/null
}
creds_write() { # stdin: name<TAB>password lines
  f=$(creds_file); tmp="$f.tmp.$$"
  awk -F '\t' 'NF >= 2 && $1 != "" { printf "[[client]]\nusername = \"%s\"\npassword = \"%s\"\n\n", $1, $2 }' > "$tmp" || die "cannot write $f"
  chmod 600 "$tmp" 2>/dev/null; mv "$tmp" "$f"
}

restart_endpoint() {
  if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files trusttunnel.service >/dev/null 2>&1; then
    systemctl restart trusttunnel >/dev/null 2>&1 || die "trusttunnel did not restart: $(journalctl -u trusttunnel -n 5 --no-pager 2>/dev/null | tail -3)"
  fi
}

# ---------- statistics: lifetime traffic and last activity per user, kept across endpoint restarts
collect() {
  [ -f "$DIR/vpn.toml" ] || return 0
  raw=$(fetch "http://$METRICS/clients" 3 2>/dev/null) || return 0
  now=$(date +%s)
  touch "$STATS"
  printf '%s' "$raw" | tr -d '[]\n' | sed 's/},[[:space:]]*{/}\n{/g' | awk -v now="$now" -v stats="$STATS" '
    function field(s, k,   r) {
      if (match(s, "\"" k "\":[^,}]*")) { r = substr(s, RSTART + length(k) + 3, RLENGTH - length(k) - 3); gsub(/"/, "", r); return r }
      return ""
    }
    BEGIN { FS = "\t"; while ((getline l < stats) > 0) { split(l, a, "\t"); n = a[1]; tin[n] = a[2]; tout[n] = a[3]; rin[n] = a[4]; rout[n] = a[5]; seen[n] = a[6]; ip[n] = a[7]; known[n] = 1; had[n] = 1 } }
    /username/ {
      n = field($0, "username"); if (n == "") next
      i = field($0, "inbound") + 0; o = field($0, "outbound") + 0; s = field($0, "sessions") + 0; addr = field($0, "ip")
      di = (i >= rin[n] + 0) ? i - rin[n] : i; do_ = (o >= rout[n] + 0) ? o - rout[n] : o
      tin[n] += di; tout[n] += do_; rin[n] = i; rout[n] = o
      if (s > 0 || ((di > 0 || do_ > 0) && (n in had))) seen[n] = now   # traffic from before the first count is not "just now"
      if (addr != "" && addr != "null") ip[n] = addr
      sess[n] = s; known[n] = 1
    }
    END { for (n in known) printf "%s\t%.0f\t%.0f\t%.0f\t%.0f\t%s\t%s\t%s\n", n, tin[n], tout[n], rin[n], rout[n], seen[n], ip[n], sess[n] + 0 }
  ' > "$STATS.tmp" && mv "$STATS.tmp" "$STATS"
}

# ---------- commands
cmd_status() {
  installed=false; running=false; version=""; listen=""; host=""; users=0; metrics=false; timer=false
  if [ -x "$DIR/trusttunnel_endpoint" ]; then
    installed=true
    version=$("$DIR/trusttunnel_endpoint" --version 2>/dev/null | head -1 | sed 's/[^0-9.]*\([0-9][0-9.]*\).*/\1/')
    listen=$(sed -n 's/^[[:space:]]*listen_address[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$DIR/vpn.toml" 2>/dev/null | head -1)
    host=$(sed -n 's/^[[:space:]]*hostname[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$DIR/hosts.toml" 2>/dev/null | head -1)
    users=$(creds_read | grep -c . 2>/dev/null)
    grep -q '^[[:space:]]*per_client_metrics[[:space:]]*=[[:space:]]*true' "$DIR/vpn.toml" 2>/dev/null && metrics=true
    systemctl is-active --quiet trusttunnel 2>/dev/null && running=true
    systemctl is-active --quiet tunnel-stats.timer 2>/dev/null && timer=true
  fi
  configured=false; [ -f "$DIR/vpn.toml" ] && configured=true
  load=$(cut -d' ' -f1 /proc/loadavg 2>/dev/null)
  cpus=$(nproc 2>/dev/null || echo 1)
  memt=$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null); mema=$(awk '/MemAvailable/ {print $2}' /proc/meminfo 2>/dev/null)
  up=$(cut -d' ' -f1 /proc/uptime 2>/dev/null | cut -d. -f1)
  os=$(. /etc/os-release 2>/dev/null && printf '%s' "$PRETTY_NAME"); arch=$(uname -m)
  p443=false; if command -v ss >/dev/null 2>&1 && ss -ltnH 2>/dev/null | awk '{print $4}' | grep -Eq '[:.]443$'; then p443=true; fi
  root=false; [ "$(id -u)" = 0 ] && root=true
  printf '{"installed":%s,"configured":%s,"running":%s,"version":%s,"listen":%s,"hostname":%s,"users":%s,"metrics":%s,"timer":%s,"load":%s,"cpus":%s,"memTotal":%s,"memAvail":%s,"uptime":%s,"os":%s,"arch":%s,"port443busy":%s,"root":%s,"dir":%s}\n' \
    "$installed" "$configured" "$running" "$(js "$version")" "$(js "$listen")" "$(js "$host")" "${users:-0}" "$metrics" "$timer" \
    "${load:-0}" "${cpus:-1}" "${memt:-0}" "${mema:-0}" "${up:-0}" "$(js "$os")" "$(js "$arch")" "$p443" "$root" "$(js "$DIR")"
}

cmd_users() { # [{"name","password","in","out","seen","ip","sessions"}], seen = unix time of the last activity (0 = never)
  need_root
  collect
  creds_read | awk -F '\t' -v stats="$STATS" '
    function j(s) { gsub(/\\/, "\\\\", s); gsub(/"/, "\\\"", s); return "\"" s "\"" }
    BEGIN { while ((getline l < stats) > 0) { split(l, a, "\t"); tin[a[1]] = a[2]; tout[a[1]] = a[3]; seen[a[1]] = a[6]; ip[a[1]] = a[7]; ses[a[1]] = a[8] } printf "[" }
    $1 != "" { printf "%s{\"name\":%s,\"password\":%s,\"in\":%d,\"out\":%d,\"seen\":%d,\"ip\":%s,\"sessions\":%d}", (n++ ? "," : ""), j($1), j($2), tin[$1], tout[$1], seen[$1], j(ip[$1]), ses[$1] }
    END { print "]" }'
}

cmd_adduser() {
  need_root; valid_name "$1"; valid_pass "$2"
  creds_read | awk -F '\t' -v n="$1" '$1 == n { f = 1 } END { exit f ? 0 : 1 }' && die "user $1 already exists"
  { creds_read; printf '%s\t%s\n' "$1" "$2"; } | creds_write
  restart_endpoint
  say '{"ok":true}'
}

cmd_deluser() {
  need_root; valid_name "$1"
  left=$(creds_read | awk -F '\t' -v n="$1" '$1 != n' | grep -c .)
  [ "$left" -gt 0 ] || die "the last user cannot be removed"
  creds_read | awk -F '\t' -v n="$1" '$1 != n' | creds_write
  [ -f "$STATS" ] && awk -F '\t' -v n="$1" '$1 != n' "$STATS" > "$STATS.tmp" && mv "$STATS.tmp" "$STATS"
  restart_endpoint
  say '{"ok":true}'
}

cmd_passwd() {
  need_root; valid_name "$1"; valid_pass "$2"
  creds_read | awk -F '\t' -v n="$1" '$1 == n { f = 1 } END { exit f ? 0 : 1 }' || die "no user $1"
  creds_read | awk -F '\t' -v OFS='\t' -v n="$1" -v p="$2" '$1 == n { $2 = p } { print }' | creds_write
  restart_endpoint
  say '{"ok":true}'
}

cmd_link() { # name address
  need_root; valid_name "$1"; [ -n "$2" ] || die "address is required"
  cd "$DIR" || die "TrustTunnel is not installed"
  out=$(./trusttunnel_endpoint vpn.toml hosts.toml -c "$1" -a "$2" 2>&1) || die "$out"
  link=$(printf '%s\n' "$out" | grep -o 'tt://[^[:space:]]*' | head -1)
  [ -n "$link" ] || die "no link in the endpoint output: $out"
  printf '{"link":%s}\n' "$(js "$link")"
}

cmd_service() { # start|stop|restart
  need_root
  systemctl "$1" trusttunnel >/dev/null 2>&1 || die "systemctl $1 failed: $(journalctl -u trusttunnel -n 5 --no-pager 2>/dev/null | tail -3)"
  say '{"ok":true}'
}

cmd_logs() {
  need_root
  journalctl -u trusttunnel -n "${1:-80}" --no-pager -o short-iso 2>&1 | tail -n "${1:-80}"
}

enable_metrics() {
  grep -q '^[[:space:]]*\[metrics\]' "$DIR/vpn.toml" && { sed -i 's/^\([[:space:]]*per_client_metrics[[:space:]]*=[[:space:]]*\)false/\1true/' "$DIR/vpn.toml"; return; }
  printf '\n[metrics]\naddress = "%s"\nrequest_timeout_secs = 3\nper_client_metrics = true\n' "$METRICS" >> "$DIR/vpn.toml"
}

install_timer() {
  cp "$0" "$DIR/tunnelctl.sh" 2>/dev/null; chmod 700 "$DIR/tunnelctl.sh"
  cat > /etc/systemd/system/tunnel-stats.service <<EOF
[Unit]
Description=Tunnel: TrustTunnel user statistics
After=trusttunnel.service

[Service]
Type=oneshot
Nice=19
IOSchedulingClass=idle
ExecStart=/bin/sh $DIR/tunnelctl.sh collect
EOF
  cat > /etc/systemd/system/tunnel-stats.timer <<EOF
[Unit]
Description=Tunnel: TrustTunnel user statistics every 5 minutes

[Timer]
OnBootSec=2min
OnUnitActiveSec=5min
AccuracySec=1min

[Install]
WantedBy=timers.target
EOF
  systemctl daemon-reload && systemctl enable --now tunnel-stats.timer >/dev/null 2>&1
}

open_port() { # port
  if command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q 'Status: active'; then
    ufw allow "$1"/tcp >/dev/null 2>&1; ufw allow "$1"/udp >/dev/null 2>&1; say "Firewall (ufw): port $1 opened"
  elif command -v firewall-cmd >/dev/null 2>&1 && firewall-cmd --state >/dev/null 2>&1; then
    firewall-cmd -q --permanent --add-port="$1"/tcp; firewall-cmd -q --permanent --add-port="$1"/udp; firewall-cmd -q --reload; say "Firewall (firewalld): port $1 opened"
  fi
}

# install KEY=VALUE...: listen user pass cert(self-signed|letsencrypt|provided) hostname email chain key stats(1|0) firewall(1|0) force(1|0)
cmd_install() {
  need_root
  listen="0.0.0.0:443"; user=""; pass=""; cert="self-signed"; hostname="vpn.endpoint"; email=""; chain=""; key=""; stats=1; firewall=1; force=0
  for kv in "$@"; do
    k=${kv%%=*}; v=${kv#*=}
    case "$k" in listen) listen=$v ;; user) user=$v ;; pass) pass=$v ;; cert) cert=$v ;; hostname) hostname=$v ;; email) email=$v ;; chain) chain=$v ;; key) key=$v ;; stats) stats=$v ;; firewall) firewall=$v ;; force) force=$v ;; esac
  done
  valid_name "$user"; valid_pass "$pass"
  [ "$(uname -s)" = Linux ] || die "only Linux servers are supported"
  command -v systemctl >/dev/null 2>&1 || die "systemd is required"
  if [ -f "$DIR/vpn.toml" ]; then
    [ "$force" = 1 ] || die "TrustTunnel is already configured in $DIR"
    b="$DIR/backup-$(date +%Y%m%d-%H%M%S)"; mkdir -p "$b"; mv "$DIR"/*.toml "$b"/ 2>/dev/null; say "Old settings moved to $b"
  fi

  say "STEP 1/5 Downloading TrustTunnel"
  ensure_tools
  fetch "$INSTALL_URL" 60 | sh -s - -a y -o "$DIR" || die "the official installer failed"
  [ -x "$DIR/setup_wizard" ] || die "setup_wizard was not installed"

  say "STEP 2/5 Generating settings and certificate"
  cd "$DIR" || die "no $DIR"
  set -- -m non-interactive -a "$listen" -c "$user:$pass" -n "$hostname" --lib-settings vpn.toml --hosts-settings hosts.toml --cert-type "$cert"
  case "$cert" in
    letsencrypt) [ -n "$email" ] || die "email is required for Let's Encrypt"; set -- "$@" --acme-email "$email" ;;
    provided) set -- "$@" --cert-chain-path "$chain" --cert-key-path "$key" ;;
  esac
  ./setup_wizard "$@" </dev/null 2>&1 || die "setup_wizard failed"
  [ -f vpn.toml ] && [ -f hosts.toml ] || die "the settings were not created"
  [ "$stats" = 1 ] && enable_metrics

  say "STEP 3/5 Installing the service"
  sed "s#/opt/trusttunnel#$DIR#g" trusttunnel.service.template > /etc/systemd/system/trusttunnel.service || die "no service template"
  systemctl daemon-reload && systemctl enable --now trusttunnel >/dev/null 2>&1 || die "trusttunnel did not start: $(journalctl -u trusttunnel -n 8 --no-pager | tail -5)"

  say "STEP 4/5 Statistics and firewall"
  [ "$stats" = 1 ] && install_timer
  [ "$firewall" = 1 ] && open_port "${listen##*:}"

  say "STEP 5/5 Checking"
  sleep 2
  systemctl is-active --quiet trusttunnel || die "trusttunnel is not running: $(journalctl -u trusttunnel -n 8 --no-pager | tail -5)"
  say "DONE"
}

cmd_update() {
  need_root
  ensure_tools
  say "STEP 1/2 Downloading the latest TrustTunnel"
  systemctl stop trusttunnel >/dev/null 2>&1
  fetch "$INSTALL_URL" 60 | sh -s - -a y -o "$DIR" || { systemctl start trusttunnel; die "the official installer failed"; }
  say "STEP 2/2 Starting"
  systemctl start trusttunnel || die "trusttunnel did not start"
  [ -f /etc/systemd/system/tunnel-stats.timer ] && cp "$0" "$DIR/tunnelctl.sh" 2>/dev/null
  say "DONE"
}

cmd_uninstall() {
  need_root
  systemctl disable --now trusttunnel tunnel-stats.timer >/dev/null 2>&1
  rm -f /etc/systemd/system/trusttunnel.service /etc/systemd/system/tunnel-stats.service /etc/systemd/system/tunnel-stats.timer
  systemctl daemon-reload
  rm -rf "$DIR"
  say '{"ok":true}'
}

c="$1"; [ $# -gt 0 ] && shift
case "$c" in
  status) cmd_status ;;
  users) cmd_users ;;
  adduser) cmd_adduser "$@" ;;
  deluser) cmd_deluser "$@" ;;
  passwd) cmd_passwd "$@" ;;
  link) cmd_link "$@" ;;
  start|stop|restart) cmd_service "$c" ;;
  logs) cmd_logs "$@" ;;
  install) cmd_install "$@" ;;
  update) cmd_update ;;
  uninstall) cmd_uninstall ;;
  collect) need_root; collect ;;
  stats) need_root; enable_metrics; install_timer; restart_endpoint; say '{"ok":true}' ;;
  *) die "unknown command: $c" ;;
esac
</script>
<script>
(function () {
'use strict';
var VERSION = 'V1.0', RELEASED = '31.10.2026';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { return Math.random().toString(36).slice(2, 9); }

/* ---------- i18n ---------- */

// install/update run on the server in the background (they survive a sleeping phone or a lost connection); the app polls the log
function startJob(a, op, args) {
  ADM.job[a.id] = { op: op, log: '', step: '', pct: 4 }; renderAdminBody();
  var inner = 'J="$HOME/.tunnel"; rm -f "$J/job.rc"; nohup sh "$J/tunnelctl.sh" ' + op + args.map(function (x) { return ' ' + sq(x); }).join('') + ' > "$J/job.log" 2>&1 < /dev/null; echo $? > "$J/job.rc"';
  ensureCtl(a).then(function () {
    var su = sudoOf(a), home = ADM.home[a.id];
    var cmd = su.pre ? su.pre + 'env HOME=' + sq(home) + ' sh -c ' + sq('(' + inner + ') >/dev/null 2>&1 &') : 'sh -c ' + sq('(' + inner + ') >/dev/null 2>&1 &');
    return sshRaw(a, cmd, su.stdin, 60);
  }).then(function (r) {
    if (r.code !== 0) throw new Error(/password|terminal/i.test(r.err || '') ? t('eSudo') : (r.err || 'exit ' + r.code));
    setTimeout(function () { pollJob(a); }, 1500);
  }, function (e) { var j = ADM.job[a.id]; if (j) { j.done = true; j.ok = false; j.error = e.message; } renderAdminBody(); });
}
function pollJob(a) {
  var j = ADM.job[a.id]; if (!j || j.done) return;
  sshRaw(a, 'J="$HOME/.tunnel"; tail -n 80 "$J/job.log" 2>/dev/null; echo "@@RC$(cat "$J/job.rc" 2>/dev/null)"', '', 30).then(function (r) {
    var out = r.out || '', i = out.lastIndexOf('@@RC'), rc = out.slice(i + 4).trim();
    j.log = out.slice(0, i).replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, '').replace(/\x1b\[[0-9;?]*[A-Za-z]/g, '').trim(); // terminal colours and links of the wizard
    var steps = j.log.match(/STEP (\d+)\/(\d+) ([^\n]*)/g);
    if (steps) { var m = /STEP (\d+)\/(\d+) (.*)/.exec(steps[steps.length - 1]); j.step = t('step', m[1], m[2]) + ' · ' + stepText(m[3]); j.pct = Math.round((m[1] - 0.5) * 100 / m[2]); }
    if (rc !== '') {
      j.done = true; j.ok = rc === '0'; j.pct = 100;
      if (!j.ok) { var e = j.log.split('\n').filter(function (l) { return /ERROR:/.test(l); }).pop(); j.error = e ? e.replace(/^.*ERROR:\s*/, '') : t('admFailed'); }
      else if (j.op === 'install' && a.firstUser) { var fu = a.firstUser; delete a.firstUser; persist(); setTimeout(function () { admLink(a, fu); }, 600); }
      ADM.up[a.id] = false; delete ADM.st[a.id]; admRefresh(a, true);
    }
    if (S.tab === 'admin') renderAdminBody();
    if (!j.done) setTimeout(function () { pollJob(a); }, 2500);
  }, function () { if (!j.done) setTimeout(function () { pollJob(a); }, 5000); });
}
function stepText(s) {
  var map = { 'Downloading TrustTunnel': t('sDownload'), 'Generating settings and certificate': t('sConfig'), 'Installing the service': t('sService'), 'Statistics and firewall': t('sStats'), 'Checking': t('sCheck'), 'Downloading the latest TrustTunnel': t('sDownload'), 'Starting': t('sStart') };
  return map[s.trim()] || s;
}

      '<div class="srow"><span>' + t('language') + '</span><div class="seg" id="sLang"><button type="button" data-v="ru" aria-pressed="' + (S.lang === 'ru') + '">RU</button><button type="button" data-v="en" aria-pressed="' + (S.lang === 'en') + '">EN</button></div></div>' +
      '</fieldset>' +
    '<fieldset><legend>' + t('launch') + '</legend>' +
      (ANDROID ? '<div class="srow"><span>' + t('alwaysOn') + '<small>' + t('alwaysOnD') + '</small></span><button class="btn sm" id="sAlways" type="button">' + t('openSettings') + '</button></div>'
        : chk('sAuto', t('autostart'), st.autostart) + chk('sOpen', t('openWin'), st.openWin, t('openWinD')) + chk('sTray', t('minTray'), st.minTray)) +
      chk('sConn', t('autoconnect'), st.autoconnect, S.servers.length ? t('autoconnectD') : t('autoconnectNo')) + '</fieldset>' +
    '<fieldset><legend>' + t('excluded') + '</legend><small class="muted">' + t('excludedD') + '</small><textarea id="sExcl" class="lines4" spellcheck="false">' + esc(st.excluded) + '</textarea><small id="sExclE" class="bad"></small></fieldset>' +
    '<fieldset><legend>' + t('logging') + '</legend>' +
      '<div class="srow"><span>' + t('level') + '<small>' + (st.level === 'debug' ? t('lvDebugD') : '') + '</small></span><div class="seg" id="sLevel"><button type="button" data-v="basic" aria-pressed="' + (st.level === 'basic') + '">' + t('lvBasic') + '</button><button type="button" data-v="debug" aria-pressed="' + (st.level === 'debug') + '">' + t('lvDebug') + '</button></div></div>' +
      '<div class="links"><button class="btn sm" id="sExp">' + t('exportLogs') + '</button><button class="btn sm danger" id="sDelLogs">' + t('delLogs') + '</button></div></fieldset>' +
    '<fieldset><legend>' + t('updates') + '</legend>' + chk('sUpd', t('autoUpd'), st.autoUpd) + '<div id="updBox">' + updHtml() + '</div></fieldset>' +
    '<fieldset><legend>' + t('about') + '</legend><div class="about"><svg viewBox="0 0 100 100"><use href="#logo"/></svg><div><b style="font-family:var(--f-display);font-size:17px">Tunnel ' + VERSION + '</b><span class="muted mono" style="font-size:12px;margin-left:12px">' + RELEASED + '</span><div class="muted">' + t(ANDROID ? 'aboutDA' : 'aboutD') + '</div></div></div>' +
      '<small class="muted credits">' + t('credits').replace('{0}', '<a href="https://github.com/TrustTunnel/TrustTunnel" target="_blank" rel="noopener">TrustTunnel</a>') + ' · <span class="nw">Apache 2.0</span></small></fieldset>' +
    '<div class="setfoot"><a class="lk gh" href="https://github.com/Carn1son/Tunnel/releases/latest" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span><b>GitHub</b><small>' + t('ghSub') + '</small></span><i aria-hidden="true">↗</i></a></div>' +
    '</div>';
  $('setClose').onclick = function () { RT.setOpen = false; render(); };
  function seg(id, fn) { $(id).onclick = function (e) { var b = e.target.closest('button'); if (b) { fn(b.dataset.v); persist(); render(); } }; }
  seg('sLang', function (v) { S.lang = v; });
  seg('sLevel', function (v) { st.level = v; });
  [['sAuto', 'autostart'], ['sOpen', 'openWin'], ['sTray', 'minTray'], ['sConn', 'autoconnect'], ['sUpd', 'autoUpd']].forEach(function (p) { if ($(p[0])) $(p[0]).onchange = function () { st[p[1]] = this.checked; persist(); }; });
  if ($('sAlways')) $('sAlways').onclick = function () { send('vpn-settings'); };
  $('sExcl').oninput = function () {
    st.excluded = this.value; persist();
    var bad = this.value.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l && !/^(\d{1,3}(\.\d{1,3}){3}\/\d{1,2}|[0-9a-f:]+\/\d{1,3})$/i.test(l); });
    $('sExclE').textContent = bad.length ? 'CIDR: ' + bad.join(', ') : '';
  };
  $('sExp').onclick = function () { (HOST ? ask('logs-export') : Promise.resolve()).then(function () { toast(t('logsExported')); }); };
  $('sDelLogs').onclick = function () { confirmDlg(t('delLogs') + '?', '', t('del'), function () { (HOST ? ask('logs-clear') : Promise.resolve()).then(function () { toast(t('logsDeleted')); }); }); };
  $('updBox').onclick = function (e) { var b = e.target.closest('[data-upd]'); if (!b) return; if (b.dataset.upd === 'check') checkUpd(); else if (b.dataset.upd === 'go') getUpd(); };
}

/* ---------- updates ---------- */
// the state is shown in Settings next to the button, as in BoardV and 3DViewer
function updHtml() {
  var u = RT.upd || { st: 'idle' }, h = '', go = false, busy = false;
  if (u.st === 'checking') { h = t('updChecking'); busy = true; }
  else if (u.st === 'none') h = '<span class="ok">' + t('upToDate') + '</span>';
  else if (u.st === 'available') { h = t('updAvail', u.label || u.latest); go = true; }
  else if (u.st === 'downloading') { h = t('updLoading', u.pct || 0) + '<div class="bar"><i style="width:' + (u.pct || 0) + '%"></i></div>'; busy = true; }
  else if (u.st === 'installing') { h = t('updInstalling'); busy = true; }
  else if (u.st === 'error') h = '<span class="bad">' + t('updFail', u.msg || '') + '</span>';
  return (h ? '<div class="updln">' + h + '</div>' : '') + '<div class="links">' +
    (go ? '<button class="btn sm primary" type="button" data-upd="go">' + t('updNow') + '</button>' : '') +
    (busy ? '' : '<button class="btn sm" type="button" data-upd="check">' + t('checkUpd') + '</button>') + '</div>';
}
function updSet(st, extra) { RT.upd = RT.upd || {}; RT.upd.st = st; if (extra) Object.keys(extra).forEach(function (k) { RT.upd[k] = extra[k]; }); var b = $('updBox'); if (b) b.innerHTML = updHtml(); }
function checkUpd(auto) {
  if (!HOST) { updSet('none'); return; }
  if (!auto) updSet('checking');
  ask('upd-check').then(function (r) {
    if (r.error) { if (!auto) updSet('error', { msg: r.error }); return; }
    if (r.newer) updSet('available', { latest: r.latest, label: r.label });
    else if (!auto) updSet('none');
  }, function (e) { if (!auto) updSet('error', { msg: e.message }); });
}
function getUpd() {
  updSet('downloading', { pct: 0 });
  ask('upd-download').then(function (ok) { if (ok) { updSet('installing'); send('upd-install'); } });
}
function onUpd(m) {
  if (m.type === 'progress') updSet('downloading', { pct: m.pct });
  else if (m.type === 'error') updSet('error', { msg: m.msg || '' });
}

/* back on the phone: close what is open, then return to the servers screen; only there the app goes to the background */
window.tnBack = function () {
  if ($('dlg').open) { $('dlg').close(); return true; }
  if ($('ctx')) { closeMenu(); return true; }
  if (RT.setOpen) { RT.setOpen = false; render(); return true; }
  if (S && S.tab !== 'servers') { S.tab = 'servers'; persist(); render(); return true; }
  return false;
};

/* ---------- start ---------- */
$('reBtn').onclick = reconnect;
if (HOST) {
  ask('ready').then(function (r) {
    var saved = null; try { saved = r.state ? JSON.parse(r.state) : null; } catch (e) {}
    S = fill(saved, BLANK);
    S.tab = 'servers';
    render();
    onVpnState(r.vpn);
    if (r.link) importDlg(r.link);
    if (S.set.autoconnect && RT.conn === 'off' && cur()) connect();
    if (S.set.autoUpd) setTimeout(function () { checkUpd(true); }, 4000);
  });
} else {
  try { S = JSON.parse(localStorage.getItem('tunnel.ui') || 'null'); } catch (e) { S = null; }
  S = fill(S && S.servers ? S : null, DEF);
  render();
}
})();
</script>
</body>
