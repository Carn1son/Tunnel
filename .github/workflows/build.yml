name: Build Tunnel

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'site/**', '.github/workflows/site.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Build number
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      label: ${{ steps.v.outputs.label }}
      day: ${{ steps.v.outputs.day }}
      file: ${{ steps.v.outputs.file }}
      vcode: ${{ steps.v.outputs.vcode }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # VERSION holds major.minor; people see V1.0, V1.01 … V1.10; the app compares 2100.<major+1>.<minor>
          IFS=. read -r MA MI < VERSION
          MI=$((10#$MI))
          echo "ver=2100.$((MA + 1)).$MI" >> "$GITHUB_OUTPUT"
          echo "file=$MA.$MI.0" >> "$GITHUB_OUTPUT"
          echo "vcode=$((2100000000 + (MA + 1) * 10000 + MI))" >> "$GITHUB_OUTPUT"
          if [ "$MI" -eq 0 ]; then echo "label=V$MA.0" >> "$GITHUB_OUTPUT"; else echo "label=V$MA.$(printf %02d $MI)" >> "$GITHUB_OUTPUT"; fi
          echo "day=$(TZ=Europe/Moscow date +%d.%m.%Y)" >> "$GITHUB_OUTPUT"

  core:
    name: TrustTunnel engine (with split tunnelling)
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        shell: bash
        run: echo "k=core-$(cat core/REVISION)-${{ hashFiles('core/*.py', 'core/*.cpp', 'core/*.h', 'core/build.ps1') }}" >> "$GITHUB_OUTPUT"
      - name: Built engine from an earlier run
        id: cache
        uses: actions/cache@v4
        with:
          path: core/out
          key: ${{ steps.key.outputs.k }}
      - name: Conan packages from an earlier run
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ hashFiles('core/REVISION') }}
          restore-keys: conan-
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip install --quiet "conan>=2.0.5,<3"
          conan profile detect --force
          choco install nasm ninja -y --no-progress | Out-Null
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          arch: x64
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # the tail of the log goes into one annotation, so a failure is readable without the full log
          $ok = $true
          try { ./core/build.ps1 *>&1 | Tee-Object -FilePath core-build.log; if ($LASTEXITCODE) { $ok = $false } }
          catch { ($_ | Out-String) | Out-File core-build.log -Append; $ok = $false }
          if (-not $ok) {
            $errs = (Select-String -Path core-build.log -Pattern 'error:|error C[0-9]+|error LNK' -Context 0,4 | Select-Object -First 12 | ForEach-Object { $_.Line; $_.Context.PostContext }) -join '%0A'
            if ($errs) { Write-Output "::error title=engine errors::$errs" }
            $tail = (Get-Content core-build.log -Tail 60 | Where-Object { $_.Trim() }) -join '%0A'
            Write-Output "::error title=engine build::$tail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: core/out/*

  exe:
    name: Tunnel.exe (WebView2)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build info
        shell: bash
        run: printf 'version=%s\nlabel=%s\nday=%s\n' "${{ needs.meta.outputs.ver }}" "${{ needs.meta.outputs.label }}" "${{ needs.meta.outputs.day }}" > desktop/build.txt
      - name: Build
        shell: bash
        run: |
          if ! dotnet build desktop/Tunnel.csproj -c Release -nologo -p:TnFileVersion=${{ needs.meta.outputs.file }} > build.log 2>&1; then
            grep -iE "error" build.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done; tail -5 build.log; exit 1
          fi
          EXE="$(find desktop/bin -name Tunnel.exe | head -1)"
          mkdir -p dist/app && cp "$EXE" dist/
          [ -f "$EXE.config" ] && cp "$EXE.config" dist/app/   # assembly binding redirects for the libraries
          # libraries next to the exe (SSH for the Server tab); the WebView2 ones are already inside the exe
          for f in "$(dirname "$EXE")"/*.dll; do case "$(basename "$f")" in Microsoft.Web.WebView2.*) ;; *) cp "$f" dist/app/ ;; esac; done
          ls -la dist dist/app
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/

  installer:
    name: Installer
    needs: [meta, core, exe]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: bin
      - name: makensis
        shell: bash
        run: |
          MN=$(command -v makensis || true); [ -z "$MN" ] && MN="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -f "$MN" ] || command -v makensis > /dev/null || choco install nsis -y --no-progress > /dev/null
          ls -la bin
          cd desktop
          if ! "$MN" -V2 -DVERSION=${{ needs.meta.outputs.ver }} -DOUTFILE=Tunnel-Setup.exe -DBIN=../bin installer.nsi > nsis.log 2>&1; then
            tail -25 nsis.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          mkdir -p ../dist && mv Tunnel-Setup.exe ../dist/
          echo "::notice::$(ls -la ../dist | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: Tunnel-windows
          path: dist/Tunnel-Setup.exe

  android-engine:
    name: TrustTunnel engine for Android (with split tunnelling)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        run: echo "k=aar-$(cat core/REVISION)-${{ hashFiles('core/*.py', 'core/*.cpp', 'core/*.h', 'core/build-android.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Built engine from an earlier run
        id: cache
        uses: actions/cache@v4
        with:
          path: core/out-android
          key: ${{ steps.key.outputs.k }}
      - name: Conan packages from an earlier run
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-android-${{ hashFiles('core/REVISION') }}
          restore-keys: conan-android-
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.22'
          cache: false
      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet "conan>=2.0.5,<3"
          conan profile detect --force
          sudo apt-get install -y -qq ninja-build > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if ! ./core/build-android.sh > aar-build.log 2>&1; then
            echo "::error title=android engine errors::$(grep -E -A4 '(error:|error [A-Z]+[0-9]+)' aar-build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=android engine build::$(grep -v '^\s*$' aar-build.log | tail -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -5 aar-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: engine-android
          path: core/out-android/trusttunnel.aar

  android:
    name: Android APK
    needs: [meta, android-engine]
    runs-on: ubuntu-latest
    env:
      TN_VER: ${{ needs.meta.outputs.ver }}
      TN_VCODE: ${{ needs.meta.outputs.vcode }}
      TN_LABEL: ${{ needs.meta.outputs.label }}
      TN_DAY: ${{ needs.meta.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-android
          path: android/app/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Signing key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in android/keys/tunnel.jks.enc -out "$RUNNER_TEMP/tunnel.jks" -pass env:KS_PASS
            echo "TN_KEYSTORE=$RUNNER_TEMP/tunnel.jks" >> "$GITHUB_ENV"
            echo "TN_KEYPASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_PASS is not set: the APK is signed with a temporary key and will not install over a previous build"
          fi
      - name: Build
        run: |
          if ! gradle -p android assembleRelease --no-daemon > apk-build.log 2>&1; then
            echo "::error title=apk build::$(grep -E 'e: |error|FAILED|What went wrong' -A3 apk-build.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk dist/Tunnel.apk && ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Tunnel-android
          path: dist/Tunnel.apk

  release:
    name: Release (download link, updates)
    needs: [meta, installer, android]
    if: always() && needs.meta.result == 'success' && (needs.installer.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Tunnel-*
          merge-multiple: true
          path: dl
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
          LABEL: ${{ needs.meta.outputs.label }}
          DAY: ${{ needs.meta.outputs.day }}
        run: |
          set -e
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          ls -la dl
          { echo "Tunnel $LABEL от $DAY."; echo
            [ -f dl/Tunnel-Setup.exe ] && echo "- Windows, установщик: $BASE/Tunnel-Setup.exe"
            [ -f dl/Tunnel.apk ] && echo "- Android: $BASE/Tunnel.apk"
            echo; echo "Приложение само проверяет обновления: Настройки → Обновления."; } > notes.md
          gh release delete "v$VER" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" dl/* --repo "$GITHUB_REPOSITORY" --title "Tunnel $LABEL — $DAY" --notes-file notes.md --latest
      - name: Keep only the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "v$VER" ] || gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
